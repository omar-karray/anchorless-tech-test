site_name: Anchorless Tech Test Documentation
site_url: https://omar-karray.github.io/anchorless-tech-test/
theme:
  name: material
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Data Model: data-model.md
  - Backend Setup: backend-setup.md
  - Backend Architecture: backend-architecture.md
  - Frontend Auth: frontend-auth.md
  - File Upload:
      - Implementation Guide: direct-to-storage-upload.md
      - Architecture Pattern: multipard-upload-direct-to-file-storage.md
  - API Documentation: api-docs.md
  - Frontend Realtime: frontend-realtime.md
  - Troubleshooting: troubleshooting.md
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.markdownextradata
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.tasklist
  - pymdownx.mermaid
