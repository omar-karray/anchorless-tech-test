services:
    laravel.test:
        build:
            context: ./laravel-backend-api
            dockerfile: docker/8.4/Dockerfile
            args:
                WWWGROUP: 1000
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - "${APP_PORT:-80}:80"
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            WWWGROUP: "${WWWGROUP:-1000}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ./laravel-backend-api:/var/www/html
        networks:
            - appnet
        depends_on:
            - pgsql
            - redis
            - minio
            - mailpit
    horizon:
        build:
            context: ./laravel-backend-api
            dockerfile: docker/8.4/Dockerfile
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
        image: 'sail-8.4/app'
        command: php artisan horizon
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            WWWGROUP: "${WWWGROUP:-1000}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ./laravel-backend-api:/var/www/html
        depends_on:
            - pgsql
            - redis
        networks:
            - appnet
    reverb:
        build:
            context: ./laravel-backend-api
            dockerfile: docker/8.4/Dockerfile
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
        image: 'sail-8.4/app'
        command: php artisan reverb:start --host=${REVERB_SERVER_HOST:-0.0.0.0} --port=${REVERB_SERVER_PORT:-8080}
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: "${WWWUSER:-1000}"
            WWWGROUP: "${WWWGROUP:-1000}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
            REVERB_SERVER_HOST: "${REVERB_SERVER_HOST:-0.0.0.0}"
            REVERB_SERVER_PORT: "${REVERB_SERVER_PORT:-8080}"
        volumes:
            - ./laravel-backend-api:/var/www/html
        depends_on:
            - redis
        ports:
            - "${FORWARD_REVERB_PORT:-8080}:${REVERB_SERVER_PORT:-8080}"
        networks:
            - appnet
    pgsql:
        image: 'postgres:17-alpine'
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        environment:
            PGPASSWORD: "${DB_PASSWORD:-password}"
            POSTGRES_DB: "${DB_DATABASE:-laravel_backend_api}"
            POSTGRES_USER: "${DB_USERNAME:-sail}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './laravel-backend-api/docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - appnet
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - "${DB_DATABASE:-laravel_backend_api}"
                - '-U'
                - "${DB_USERNAME:-sail}"
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - 'sail-redis:/data'
        networks:
            - appnet
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    minio:
        image: 'minio/minio:latest'
        ports:
            - "${FORWARD_MINIO_PORT:-9000}:9000"
            - "${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900"
        environment:
            MINIO_ROOT_USER: sail
            MINIO_ROOT_PASSWORD: password
        volumes:
            - 'sail-minio:/data'
        networks:
            - appnet
        command: 'minio server /data --console-address ":8900"'
        healthcheck:
            test:
                - CMD
                - mc
                - ready
                - local
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - appnet
    react-frontend:
        build:
            context: ./react-router-frontend-app
            dockerfile: Dockerfile
        image: 'react-frontend/app'
        ports:
            - "3000:3000"
            - "5173:5173"
        environment:
            NODE_ENV: development
        volumes:
            - ./react-router-frontend-app:/app
        networks:
            - appnet
        depends_on:
            - laravel.test        
networks:
    appnet:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-minio:
        driver: local
